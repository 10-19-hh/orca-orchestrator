[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-orchestrator"
version = "0.0.1"
description = "PRD-driven agent orchestrator control plane using Orca as the execution plane"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Interactive console (python -m orca_orchestrator in a terminal). Without it the read-only screen opens.
tui = ["textual>=8.2.8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orca_orchestrator = ["fixtures/*.json"]
